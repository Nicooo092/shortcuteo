[package]
name = "shortcuteo"
version = "0.0.0"
description = "Action shortcuts for Windows"
authors = ["Nico"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "shortcuteo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
async-trait = "0.1"
inventory = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync"] }
tokio-util = "0.7"
ts-rs = { version = "12", features = ["indexmap-impl", "serde-json-impl", "chrono-impl"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
window-vibrancy = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
