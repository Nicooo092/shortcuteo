[package]
name = "shortcuteo"
version = "0.0.0"
description = "Action shortcuts for Windows"
authors = ["Nico"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "shortcuteo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
